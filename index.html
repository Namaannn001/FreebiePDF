<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f3f3f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c0c" media="(prefers-color-scheme: dark)" />
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('freebiepdf.web.theme'));
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t;
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.content = t === 'light' ? '#f3f3f3' : '#0c0c0c';
          });
        }
      } catch (e) {}
    </script>
    <meta name="description" content="Private PDF tools that run in your browser." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.png" type="image/png" sizes="192x192" />
    <link rel="icon" href="./logo.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
    <title>Anywhere PDF | Browser PDF tools</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
